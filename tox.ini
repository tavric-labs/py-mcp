[tox]
envlist = py311, py312, py313, py314, lint, coverage
skip_missing_interpreters = true

[testenv]
deps =
    pytest
    pytest-cov
    pytest-anyio
    requests
    uvicorn
    fastapi
    httpx
commands =
    pytest --cov=pymcp --cov-config=.coveragerc --cov-report=term-missing

[testenv:lint]
deps =
    # ruff 0.16 changed default rule behaviour (149 new findings); stay on 0.15 until the code is migrated
    ruff>=0.15,<0.16
commands =
    ruff check .

[testenv:coverage]
deps =
    pytest
    pytest-cov
    pytest-anyio
    requests
    uvicorn
    fastapi
    httpx
commands =
    pytest --cov=pymcp --cov-config=.coveragerc --cov-report=xml
