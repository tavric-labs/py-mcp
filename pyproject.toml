[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "pymcp-kit"
version = "0.3.0"
description = "A capability-first MCP server toolkit for FastAPI with Streamable HTTP and stdio transport"
authors = [
    { name = "Prince Roshan", email = "princekrroshan01@gmail.com" }
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi",
    "jsonschema",
    "pydantic>=2.7.0,<3",
    "typing-extensions>=4.0",
    "uvicorn",
    "requests"
]
license = {text = "MIT"}

[project.urls]
Homepage = "https://py-mcp.tavric-labs.net/"
Documentation = "https://py-mcp.tavric-labs.net/"
Repository = "https://github.com/tavric-labs/py-mcp"

[tool.setuptools.packages.find]
include = ["pymcp*"]
exclude = ["company*"]

[tool.ruff]
extend-exclude = ["company"]
